# ==============================================================================
# MediLedger Spring Boot Production Configuration (Profile: prod)
# Target Infrastructure: Render (Web Service) + Aiven (PostgreSQL)
# ==============================================================================

# Server Configuration (Render injects dynamic PORT)
server.port=${PORT:8080}
server.servlet.context-path=

# Application Name
spring.application.name=mediledger-backend

# Production PostgreSQL Datasource (Supports Spring standard & cloud provider envs)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Tuned for low-cost/free tier limits on Aiven & Render)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=MediLedgerProdHikariPool

# JPA & Hibernate (Strict production validation, no schema tampering)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Migrations (Automated migration on startup with baseline support)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Spring Boot Actuator (Health check for Render without leaking sensitive internals)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# CORS Allowed Origins (Comma-separated list of production frontend origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://mediledger.vercel.app}

# Production Logging Configuration
logging.level.root=INFO
logging.level.com.mediledger=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Disable Swagger UI in strict production if desired, or expose for testing
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
